<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0C447C"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Magazyn"/>
<link rel="manifest" href="manifest.json"/>
<title>Magazyn</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0C447C;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;background:#F0F4F8}

  /* TOP BAR */
  .topbar{background:#0C447C;padding:env(safe-area-inset-top,12px) 16px 14px;color:#fff;flex-shrink:0}
  .topbar-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .topbar h1{font-size:20px;font-weight:600;letter-spacing:-0.3px}
  .mic-status-dot{width:10px;height:10px;border-radius:50%;background:#4CAF50;display:inline-block;margin-right:6px;animation:blink 1.5s infinite}
  .mic-status-dot.off{background:#888;animation:none}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
  .status-text{font-size:13px;opacity:0.85;display:flex;align-items:center}
  .badge{background:rgba(255,255,255,0.18);border-radius:20px;padding:3px 10px;font-size:12px}

  /* BIG MIC BUTTON */
  .mic-section{background:#0C447C;padding:0 16px 20px;flex-shrink:0}
  .mic-btn{width:100%;padding:18px;border-radius:16px;border:none;font-size:17px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform 0.1s,background 0.2s}
  .mic-btn.listening{background:#C62828;color:#fff}
  .mic-btn.stopped{background:#1565C0;color:#fff}
  .mic-btn:active{transform:scale(0.97)}
  .mic-icon{width:24px;height:24px;flex-shrink:0}

  /* RESULT */
  .result-wrap{padding:12px 16px;flex-shrink:0}
  .result-card{border-radius:16px;padding:16px;display:none}
  .result-card.found{background:#E3F2FD;border:1.5px solid #90CAF9;display:block}
  .result-card.notfound{background:#FFEBEE;border:1.5px solid #EF9A9A;display:block}
  .result-name{font-size:17px;font-weight:600;color:#0D2B4E;margin-bottom:8px}
  .result-loc-label{font-size:10px;color:#1565C0;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:2px}
  .result-loc{font-size:44px;font-weight:700;color:#0C447C;font-family:monospace;line-height:1;margin-bottom:8px}
  .result-meta{display:flex;gap:8px;flex-wrap:wrap}
  .meta-chip{background:rgba(21,101,192,0.12);color:#0D47A1;border-radius:20px;padding:4px 12px;font-size:13px}
  .notfound-title{font-size:16px;font-weight:600;color:#B71C1C;margin-bottom:4px}
  .notfound-sub{font-size:13px;color:#C62828}

  /* HEARD */
  .heard-row{padding:6px 16px 2px;display:flex;align-items:center;gap:8px;flex-shrink:0}
  .heard-label{font-size:12px;color:#888}
  .heard-val{font-size:18px;font-weight:700;font-family:monospace;color:#0C447C;letter-spacing:0.1em}

  /* TABS */
  .tabs{display:flex;border-bottom:1px solid #E0E0E0;background:#fff;flex-shrink:0}
  .tab{flex:1;padding:12px 4px;border:none;background:none;font-size:13px;font-weight:500;color:#888;cursor:pointer;border-bottom:2px solid transparent;transition:color 0.15s}
  .tab.active{color:#0C447C;border-bottom-color:#0C447C}

  /* PANELS */
  .panel{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .panel.active{display:block}

  /* ADD FORM */
  .form-wrap{padding:16px}
  .photo-btn-row{display:flex;gap:8px;margin-bottom:14px}
  .photo-btn{flex:1;padding:14px 8px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
  .photo-btn.cam{background:#0C447C;color:#fff}
  .photo-btn.gal{background:#1565C0;color:#fff}
  .photo-btn svg{width:22px;height:22px}
  #preview-img{width:100%;border-radius:12px;max-height:160px;object-fit:cover;display:none;margin-bottom:10px}
  .ai-bar{background:#E3F2FD;border-radius:10px;padding:10px 14px;font-size:13px;color:#0D47A1;margin-bottom:10px;display:none;text-align:center}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:#666;margin-bottom:4px;font-weight:500}
  .field input{width:100%;padding:12px;border:1.5px solid #DDD;border-radius:10px;font-size:15px;background:#FAFAFA;color:#111;-webkit-appearance:none}
  .field input:focus{outline:none;border-color:#0C447C;background:#fff}
  .field-row{display:flex;gap:10px}
  .field-row .field{flex:1}
  .save-btn{width:100%;padding:15px;background:#0C447C;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px}
  .save-btn:active{background:#083566}
  .divider{height:1px;background:#EEE;margin:16px 0}
  .section-title{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;font-weight:600}
  .csv-area{background:#F5F5F5;border-radius:10px;padding:12px;margin-bottom:10px;font-size:12px;color:#555;line-height:1.6}
  .csv-area code{background:#E0E0E0;padding:1px 5px;border-radius:4px;font-size:11px}
  .import-btn{width:100%;padding:13px;background:#2E7D32;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
  #csv-file-input,#photo-input,#gallery-input{display:none}

  /* LIST */
  .list-wrap{padding:10px 12px}
  .list-search{padding:10px 12px;position:sticky;top:0;background:#F0F4F8;z-index:2;border-bottom:1px solid #E0E0E0}
  .list-search input{width:100%;padding:10px 14px;border:1.5px solid #DDD;border-radius:10px;font-size:15px;background:#fff;-webkit-appearance:none}
  .list-search input:focus{outline:none;border-color:#0C447C}
  .item-card{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;border:0.5px solid #E8E8E8}
  .item-loc{background:#E3F2FD;color:#0C447C;border-radius:8px;padding:6px 10px;font-family:monospace;font-size:16px;font-weight:700;min-width:52px;text-align:center;flex-shrink:0}
  .item-info{flex:1;min-width:0}
  .item-name{font-size:14px;font-weight:600;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item-ean{font-size:11px;color:#999;font-family:monospace;margin-top:1px}
  .item-qty{font-size:12px;color:#666;margin-top:1px}
  .item-del{background:none;border:none;padding:8px;color:#CCC;font-size:18px;cursor:pointer;border-radius:8px;flex-shrink:0}
  .item-del:active{background:#FFEBEE;color:#C62828}
  .empty-state{text-align:center;padding:40px 20px;color:#AAA;font-size:15px}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <h1>📦 Asystent Magazynowy</h1>
    <div class="topbar-row">
      <div class="status-text">
        <span class="mic-status-dot" id="mic-dot"></span>
        <span id="status-label">Nasłuchiwanie aktywne</span>
      </div>
      <span class="badge" id="db-count">0 towarów</span>
    </div>
  </div>

  <div class="mic-section">
    <button class="mic-btn listening" id="mic-btn" onclick="toggleListening()">
      <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1 17.93V21h-2v2h6v-2h-2v-2.07A8 8 0 0 0 20 11h-2a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93z"/>
      </svg>
      <span id="mic-btn-label">ZATRZYMAJ NASŁUCHIWANIE</span>
    </button>
  </div>

  <div class="heard-row">
    <span class="heard-label">Ostatnio słyszę:</span>
    <span class="heard-val" id="heard-val">—</span>
  </div>

  <div class="result-wrap">
    <div id="result-card" class="result-card"></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('add')" id="tab-add">➕ Dodaj</button>
    <button class="tab" onclick="showTab('list')" id="tab-list">📋 Lista</button>
  </div>

  <div id="panel-add" class="panel active">
    <div class="form-wrap">
      <div class="section-title">Dodaj towar ze zdjęcia lub ręcznie</div>
      <div class="photo-btn-row">
        <button class="photo-btn cam" onclick="document.getElementById('photo-input').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M3 8l3-5h12l3 5"/><circle cx="12" cy="14" r="3"/></svg>
          Aparat
        </button>
        <button class="photo-btn gal" onclick="document.getElementById('gallery-input').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          Galeria
        </button>
      </div>
      <input type="file" id="photo-input" accept="image/*" capture="environment" onchange="handleImage(event)"/>
      <input type="file" id="gallery-input" accept="image/*" onchange="handleImage(event)"/>
      <img id="preview-img"/>
      <div class="ai-bar" id="ai-bar">🤖 Analizuję zdjęcie...</div>

      <div class="field">
        <label>Kod EAN *</label>
        <input id="f-ean" type="text" inputmode="numeric" placeholder="np. 5901234567890"/>
      </div>
      <div class="field">
        <label>Nazwa towaru *</label>
        <input id="f-name" type="text" placeholder="np. Kawa ziarnista 1kg"/>
      </div>
      <div class="field">
        <label>Lokalizacja / regał *</label>
        <input id="f-loc" type="text" placeholder="np. A3 lub B12"/>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Ilość (szt.)</label>
          <input id="f-qty" type="number" inputmode="numeric" placeholder="0"/>
        </div>
        <div class="field">
          <label>Cena (zł)</label>
          <input id="f-price" type="number" inputmode="decimal" placeholder="0.00"/>
        </div>
      </div>
      <button class="save-btn" onclick="saveItem()">Zapisz towar</button>

      <div class="divider"></div>
      <div class="section-title">Import z pliku CSV</div>
      <div class="csv-area">
        Format pliku: <code>ean,nazwa,lokalizacja,ilosc,cena</code><br/>
        Przykład: <code>5901234567890,Kawa 1kg,A3,50,12.99</code>
      </div>
      <input type="file" id="csv-file-input" accept=".csv,text/plain" onchange="importCSV(event)"/>
      <button class="import-btn" onclick="document.getElementById('csv-file-input').click()">📂 Wybierz plik CSV</button>
    </div>
  </div>

  <div id="panel-list" class="panel">
    <div class="list-search">
      <input id="search-input" type="text" placeholder="Szukaj towaru..." oninput="renderList()"/>
    </div>
    <div class="list-wrap" id="list-wrap"></div>
  </div>

</div>

<script>
// ─── DATABASE (localStorage) ───────────────────────────────────────────────
let db = [];
function loadDB() { try { db = JSON.parse(localStorage.getItem('mag_v2') || '[]'); } catch(e){ db=[]; } updateCount(); }
function saveDB() { localStorage.setItem('mag_v2', JSON.stringify(db)); updateCount(); }
function updateCount() { document.getElementById('db-count').textContent = db.length + ' towarów'; }

// ─── TAB SWITCH ────────────────────────────────────────────────────────────
function showTab(name) {
  ['add','list'].forEach(t => {
    document.getElementById('panel-'+t).classList.toggle('active', t===name);
    document.getElementById('tab-'+t).classList.toggle('active', t===name);
  });
  if(name==='list') renderList();
}

// ─── SPEECH RECOGNITION ────────────────────────────────────────────────────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;
let restartTimer = null;

function toggleListening() {
  if(listening) { stopListening(true); }
  else { startListening(); }
}

function startListening() {
  if(!SR) { alert('Twoja przeglądarka nie obsługuje rozpoznawania mowy.\nUżyj Chrome na Androidzie.'); return; }
  if(recognition) { try{recognition.abort();}catch(e){} }
  recognition = new SR();
  recognition.lang = 'pl-PL';
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 3;

  recognition.onstart = () => {
    listening = true;
    updateMicUI(true);
  };

  recognition.onresult = (e) => {
    let interim='', final='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) final+=t; else interim+=t;
    }
    const raw=final||interim;
    const digits = spokenToDigits(raw);
    if(digits) document.getElementById('heard-val').textContent='...'+digits;
    if(final && digits && digits.length>=2) {
      searchProduct(digits);
    }
  };

  recognition.onerror = (e) => {
    if(e.error==='not-allowed') { stopListening(true); alert('Zezwól na dostęp do mikrofonu!'); return; }
    scheduleRestart(300);
  };

  recognition.onend = () => {
    if(listening) scheduleRestart(150);
  };

  try { recognition.start(); } catch(e) { scheduleRestart(500); }
}

function stopListening(manual=false) {
  listening = false;
  clearTimeout(restartTimer);
  try { recognition?.abort(); } catch(e){}
  updateMicUI(false);
}

function scheduleRestart(delay) {
  clearTimeout(restartTimer);
  if(listening) restartTimer = setTimeout(() => { if(listening) startListening(); }, delay);
}

function updateMicUI(on) {
  const dot = document.getElementById('mic-dot');
  const btn = document.getElementById('mic-btn');
  const label = document.getElementById('mic-btn-label');
  const status = document.getElementById('status-label');
  dot.className = 'mic-status-dot' + (on?'':' off');
  btn.className = 'mic-btn ' + (on?'listening':'stopped');
  label.textContent = on ? 'ZATRZYMAJ NASŁUCHIWANIE' : 'WŁĄCZ NASŁUCHIWANIE';
  status.textContent = on ? 'Nasłuchiwanie aktywne' : 'Nasłuchiwanie zatrzymane';
}

// ─── DIGIT CONVERSION ──────────────────────────────────────────────────────
function spokenToDigits(text) {
  const map = {
    'zero':'0','jeden':'1','jedna':'1','jeden':'1',
    'dwa':'2','dwie':'2','dwa':'2',
    'trzy':'3','cztery':'4',
    'pięć':'5','piec':'5','pieć':'5',
    'sześć':'6','szesc':'6','szesć':'6',
    'siedem':'7','osiem':'8',
    'dziewięć':'9','dziewiec':'9','dziewięc':'9'
  };
  let result='';
  const words = text.toLowerCase().trim().split(/\s+/);
  for(const w of words){
    if(map[w]) result+=map[w];
    else result+=w.replace(/\D/g,'');
  }
  if(!result) result=text.replace(/\D/g,'');
  return result;
}

// ─── SEARCH ────────────────────────────────────────────────────────────────
function searchProduct(digits) {
  const matches = db.filter(i => i.ean && i.ean.endsWith(digits));
  const card = document.getElementById('result-card');

  if(matches.length===0) {
    card.className='result-card notfound';
    card.innerHTML=`<div class="notfound-title">Nie znaleziono towaru</div><div class="notfound-sub">Kod kończy się na: ...${digits}</div>`;
    speak('Nie znaleziono towaru z tym kodem');
  } else if(matches.length===1) {
    const m=matches[0];
    const loc=m.location||'brak';
    card.className='result-card found';
    card.innerHTML=`
      <div class="result-name">${m.name}</div>
      <div class="result-loc-label">Lokalizacja</div>
      <div class="result-loc">${loc}</div>
      <div class="result-meta">
        ${m.quantity!=null?`<span class="meta-chip">Ilość: ${m.quantity} szt.</span>`:''}
        ${m.price?`<span class="meta-chip">${parseFloat(m.price).toFixed(2)} zł</span>`:''}
      </div>`;
    speak(`${m.name}. Lokalizacja: ${loc.split('').join(' ')}. Ilość: ${m.quantity||0}`);
  } else {
    card.className='result-card found';
    card.innerHTML=`<div class="result-name">Znaleziono ${matches.length} towarów (EAN: ...${digits})</div>`+
      matches.slice(0,5).map(m=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid #BBDEFB"><span style="font-size:13px">${m.name}</span><span style="font-family:monospace;font-weight:700;color:#0C447C">${m.location||'—'}</span></div>`).join('');
    speak('Znaleziono '+matches.length+' towarów. '+matches.slice(0,3).map(m=>`${m.name}, lokalizacja ${(m.location||'').split('').join(' ')}`).join('. '));
  }
}

// ─── TTS ───────────────────────────────────────────────────────────────────
function speak(text) {
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='pl-PL'; u.rate=0.95; u.pitch=1;
  speechSynthesis.speak(u);
}

// ─── SAVE ITEM ─────────────────────────────────────────────────────────────
function saveItem() {
  const ean=document.getElementById('f-ean').value.trim();
  const name=document.getElementById('f-name').value.trim();
  const loc=document.getElementById('f-loc').value.trim();
  const qty=document.getElementById('f-qty').value;
  const price=document.getElementById('f-price').value;
  if(!ean||!name||!loc){alert('Wypełnij EAN, nazwę i lokalizację!');return;}
  const existing=db.findIndex(i=>i.ean===ean);
  const item={ean,name,location:loc,quantity:qty?parseInt(qty):0,price:price?parseFloat(price):0};
  if(existing>=0) db[existing]=item; else db.push(item);
  saveDB();
  ['f-ean','f-name','f-loc','f-qty','f-price'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('preview-img').style.display='none';
  speak('Towar '+name+' zapisany');
  showTab('list');
}

// ─── IMAGE / AI ────────────────────────────────────────────────────────────
async function handleImage(event) {
  const file=event.target.files[0]; if(!file) return;
  event.target.value='';
  const reader=new FileReader();
  reader.onload=async(e)=>{
    const prev=document.getElementById('preview-img');
    prev.src=e.target.result; prev.style.display='block';
    const bar=document.getElementById('ai-bar');
    bar.style.display='block'; bar.textContent='🤖 Analizuję zdjęcie...';
    const b64=e.target.result.split(',')[1];
    const mime=file.type||'image/jpeg';
    try {
      const resp=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:400,
          messages:[{role:'user',content:[
            {type:'image',source:{type:'base64',media_type:mime,data:b64}},
            {type:'text',text:'Przeanalizuj zdjęcie etykiety/dokumentu magazynowego. Wyodrębnij: kod EAN (cyfry), nazwę towaru, lokalizację (np. A3), ilość. Odpowiedz TYLKO czystym JSON bez markdown: {"ean":"","name":"","location":"","quantity":0}. Jeśli pole niewidoczne — pusty string lub 0.'}
          ]}]
        })
      });
      const data=await resp.json();
      const text=data.content?.[0]?.text||'{}';
      const clean=text.replace(/```json|```/g,'').trim();
      const p=JSON.parse(clean);
      if(p.ean) document.getElementById('f-ean').value=p.ean;
      if(p.name) document.getElementById('f-name').value=p.name;
      if(p.location) document.getElementById('f-loc').value=p.location;
      if(p.quantity) document.getElementById('f-qty').value=p.quantity;
      bar.textContent='✅ Dane odczytane ze zdjęcia — sprawdź i zapisz';
    } catch(err) {
      bar.textContent='⚠️ Błąd AI — uzupełnij dane ręcznie';
    }
  };
  reader.readAsDataURL(file);
}

// ─── CSV IMPORT ─────────────────────────────────────────────────────────────
function importCSV(event) {
  const file=event.target.files[0]; if(!file) return;
  event.target.value='';
  const reader=new FileReader();
  reader.onload=(e)=>{
    const lines=e.target.result.split('\n').map(l=>l.trim()).filter(l=>l);
    let imported=0, skipped=0;
    const start=lines[0]?.toLowerCase().includes('ean')?1:0;
    for(let i=start;i<lines.length;i++){
      const cols=lines[i].split(/[,;]/).map(c=>c.trim().replace(/^"|"$/g,''));
      if(cols.length<3){skipped++;continue;}
      const [ean,name,location,qty,price]=cols;
      if(!ean||!name){skipped++;continue;}
      const existing=db.findIndex(it=>it.ean===ean);
      const item={ean,name,location:location||'',quantity:qty?parseInt(qty):0,price:price?parseFloat(price):0};
      if(existing>=0) db[existing]=item; else db.push(item);
      imported++;
    }
    saveDB();
    alert(`Zaimportowano: ${imported} towarów${skipped?'\nPominięto: '+skipped+' wierszy':''}`);
    showTab('list');
  };
  reader.readAsText(file,'UTF-8');
}

// ─── LIST RENDER ────────────────────────────────────────────────────────────
function renderList() {
  const q=(document.getElementById('search-input')?.value||'').toLowerCase();
  const filtered=db.filter(i=>!q||i.name.toLowerCase().includes(q)||i.ean.includes(q)||i.location.toLowerCase().includes(q));
  const wrap=document.getElementById('list-wrap');
  if(filtered.length===0){
    wrap.innerHTML=`<div class="empty-state">${db.length===0?'Brak towarów.<br/>Dodaj pierwszy towar ➕':'Brak wyników dla: '+q}</div>`;
    return;
  }
  wrap.innerHTML=filtered.map((item,i)=>{
    const idx=db.indexOf(item);
    return `<div class="item-card">
      <div class="item-loc">${item.location||'?'}</div>
      <div class="item-info">
        <div class="item-name">${item.name}</div>
        <div class="item-ean">${item.ean}</div>
        ${item.quantity?`<div class="item-qty">${item.quantity} szt.</div>`:''}
      </div>
      <button class="item-del" onclick="deleteItem(${idx})">✕</button>
    </div>`;
  }).join('');
}

function deleteItem(idx) {
  if(!confirm('Usunąć: '+db[idx]?.name+'?')) return;
  db.splice(idx,1); saveDB(); renderList();
}

// ─── INIT ──────────────────────────────────────────────────────────────────
loadDB();
// Auto-start listening after short delay
setTimeout(()=>{ startListening(); }, 800);
</script>
</body>
</html>
